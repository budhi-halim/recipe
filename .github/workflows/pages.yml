name: Validate and deploy Recipe
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scaling and recipes
        run: |
          npm test
          node scripts/validate_recipes.mjs
      - name: Install image dependency
        run: python -m pip install Pillow
      - name: Build individual sushi artwork and five WebP sizes
        run: python scripts/build_sushi_images.py
      - name: Commit generated image tiers
        run: |
          git add assets/responsive/sushi-*.webp
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generate responsive sushi artwork [skip ci]"
            git push origin HEAD:master
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
