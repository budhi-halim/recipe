name: Validate and deploy Recipe
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photo builder
        run: python -m pip install Pillow
      - name: Generate five responsive photo tiers per Sushi recipe
        run: python scripts/build_sushi_images.py
      - name: Validate recipes, navigation, scaling, and image presence
        run: npm test
      - name: Smoke-test desktop/mobile nested Sushi catalogue
        run: |
          npm install --no-save playwright-core
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/recipe-http.log 2>&1 &
          node tests/browser-smoke.mjs
      - name: Store generated photographs
        run: |
          git add assets/responsive/sushi-*.webp
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build approved Sushi progressive photo tiers [skip ci]"
            git push origin HEAD:master
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
